name: Garmin-synk

# Hämtar Nellies Garmin-data till Supabase. Gör ingenting förrän hemligheterna
# SUPABASE_URL, SUPABASE_SERVICE_KEY och NELLIE_USER_ID finns (se README).
# Loggen innehåller bara antal – aldrig hälsodata.

on:
  schedule:
    # Varje timme 05–22 svensk tid (UTC-tider). Första körningen 05:17 ger dagsformen till morgonen.
    - cron: '17 4-21 * * *'
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: pip install -r sync/requirements.txt
      - run: python sync/garmin_sync.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NELLIE_USER_ID: ${{ secrets.NELLIE_USER_ID }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
